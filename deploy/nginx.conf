# Salin ke: /etc/nginx/sites-available/absensi lalu symlink ke sites-enabled.
# Setelah DNS mengarah ke VPS: sudo certbot --nginx -d absensi.geezplay.site
server {
    listen 80;
    server_name absensi.geezplay.site;

    root /var/www/absensi/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    access_log /var/log/nginx/absensi-access.log;
    error_log /var/log/nginx/absensi-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # sesuai versi PHP di server (php8.3-fpm)
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    client_max_body_size 10M;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
